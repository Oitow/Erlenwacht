<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111b20">
  <title>Erlenwacht · Dammerwald</title>
  <link rel="stylesheet" href="./src/ui/game.css">
  <link rel="stylesheet" href="./src/inventory/inventory.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
  </script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main id="game" aria-label="Erlenwacht">
    <canvas id="viewport" aria-label="Spielwelt"></canvas>
    <div id="hud" hidden>
      <header class="game-header">
        <section class="objective" aria-label="Gebiet und Aufgabe">
          <h1 id="region">Dammerwald</h1>
          <p id="objective">Folge dem Laternenpfad zur Enklave.</p>
        </section>
        <button id="bag" type="button" aria-haspopup="dialog" aria-keyshortcuts="I">
          <span aria-hidden="true">◇</span> Beutel <span id="bag-count"></span>
        </button>
      </header>

      <section class="vitals" aria-label="Charakterstatus">
        <div class="health-label"><span>Leben</span><span id="life">100 / 100</span></div>
        <meter id="health" min="0" max="100" low="30" optimum="100" value="100" aria-label="Leben"></meter>
      </section>

      <div class="game-footer">
        <p id="notice" role="status"></p>
        <button id="interact" type="button" aria-keyshortcuts="E" hidden></button>
        <div class="controls">
          <div id="stick" aria-hidden="true"><div id="nub"></div></div>
          <p class="key-hint">WASD <span>Laufen</span> · Ziehen <span>Kamera</span> · E <span>Interaktion</span></p>
          <div class="actions">
            <button id="auto" type="button" aria-pressed="false" aria-keyshortcuts="R">Auto</button>
            <button id="jump" type="button" aria-keyshortcuts="Q">Sprung</button>
            <button id="spell" type="button" aria-keyshortcuts="Space">✦ <span>Rune</span></button>
          </div>
        </div>
        <div id="performance" aria-label="Bildrate"></div>
      </div>
    </div>
    <dialog id="inventory" aria-labelledby="inventory-title"></dialog>
    <dialog id="defeat" aria-labelledby="defeat-title">
      <h2 id="defeat-title">Du bist gefallen</h2>
      <p>Kehre mit deinem Beutel zum letzten Rastpunkt zurück.</p>
      <button type="button" id="respawn">Rastpunkt</button>
    </dialog>
    <div id="boot" role="status">
      <strong>Erlenwacht</strong>
      <p id="boot-message">Der Dammerwald lädt …</p>
    </div>
    <noscript>Erlenwacht benötigt JavaScript.</noscript>
  </main>
</body>
</html>
