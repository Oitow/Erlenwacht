<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Erlenwacht · Dammerwald</title>
<style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#080d11;color:#eee;font:14px system-ui;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;justify-content:space-between;text-shadow:0 2px 5px #000}#quest{position:absolute;top:50px;left:12px;background:#101b21b9;border:1px solid #64745a66;padding:10px;border-radius:8px;max-width:250px}#stick{position:absolute;bottom:35px;left:25px;width:116px;height:116px;border-radius:100%;border:2px solid #b8c5a66b;background:#15251d77;pointer-events:auto;touch-action:none}#nub{position:absolute;left:37px;top:37px;width:40px;height:40px;border-radius:50%;background:#afc2a49c}#buttons{position:absolute;right:20px;bottom:40px;display:flex;gap:10px;pointer-events:auto}button{border:1px solid #d6d0b488;border-radius:50%;width:66px;height:66px;color:white;background:#344b46dd;font-weight:bold}#msg{position:absolute;bottom:172px;left:12px;right:12px;text-align:center;text-shadow:0 2px 5px black}#error{position:absolute;top:35%;left:10%;right:10%;background:#511;padding:15px;display:none}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script></head><body><div id="hud"><div id="top"><b>ERLENWACHT · PROTOTYP 0.1</b><span id="fps">…</span></div><div id="quest">Folge dem Laternenpfad durch den Dammerwald zur Enklave.</div><div id="msg">WASD oder linker Touch-Stick · Zauber: Leertaste</div><div id="stick"><div id="nub"></div></div><div id="buttons"><button id="spell">✦<br>AOE</button><button id="jump">↑<br>Sprung</button></div><div id="error"></div></div><script type="module">
import * as T from 'three';
const scene=new T.Scene();scene.background=new T.Color(0x10191d);scene.fog=new T.FogExp2(0x10191d,.011);
const camera=new T.PerspectiveCamera(64,innerWidth/innerHeight,.1,500);
const renderer=new T.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0x829ba9,0x263322,1.8));const moon=new T.DirectionalLight(0xb9d2c5,2.3);moon.position.set(-30,65,25);scene.add(moon);
const mat=(c,r=1)=>new T.MeshStandardMaterial({color:c,roughness:r});
const ground=new T.Mesh(new T.PlaneGeometry(500,500),mat(0x273a30));ground.rotation.x=-Math.PI/2;scene.add(ground);
const road=new T.Mesh(new T.PlaneGeometry(8,190),mat(0x544c3c));road.rotation.x=-Math.PI/2;road.position.set(0,.012,-55);scene.add(road);
const trunk=mat(0x312b28),leaves=[mat(0x1b302b),mat(0x263b33),mat(0x1b2725)],stone=mat(0x3e4543),gold=new T.MeshBasicMaterial({color:0xffbf68}),enemyMat=mat(0x6a342e);
const cyl=new T.CylinderGeometry(1,1.4,1,7),cone=new T.ConeGeometry(1,1,7),box=new T.BoxGeometry(1,1,1);
function mesh(g,m,x,y,z,sx=1,sy=1,sz=1){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);scene.add(o);return o}
let seed=813;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<330;i++){let x=(rnd()-.5)*190,z=(rnd()-.5)*220-35;if(Math.abs(x)<7&&z<42&&z>-152)continue;const h=9+rnd()*19;mesh(cyl,trunk,x,h*.45,z,.6+rnd()*.6,h, .6+rnd()*.6);for(let j=0;j<3;j++)mesh(cone,leaves[i%3],x,h*.65+j*h*.15,z,3.5+j*.4,h*.5,3.5+j*.4)}
for(let z=35;z>-150;z-=16){for(const x of [-5.5,5.5]){mesh(cyl,stone,x,1,z,.32,2,.32);mesh(box,gold,x,2.2,z,.5,.7,.5);const p=new T.PointLight(0xffa64c,6,15);p.position.set(x,2.3,z);scene.add(p)}}
for(let i=0;i<45;i++){const x=(rnd()-.5)*130,z=(rnd()-.5)*175-45;if(Math.abs(x)<7)continue;mesh(new T.DodecahedronGeometry(1,0),stone,x,.5,z,1+rnd()*2,.6+rnd(),1+rnd()*2)}
// Distant enclave gate and silhouette.
for(const x of [-13,13]){mesh(box,stone,x,7,-151,8,14,7);mesh(cone,mat(0x242b35),x,17,-151,6,8,6)}
mesh(box,stone,0,11,-166,25,21,7);mesh(box,mat(0x191f26),0,6,-151,8,12,1);
const player=new T.Group();scene.add(player);const cloak=mesh(cyl,mat(0x39474d),0,1,0,.53,1.5,.45);player.add(cloak);scene.remove(cloak);cloak.position.set(0,0,0);const head=new T.Mesh(new T.SphereGeometry(.33,9,7),mat(0xb7a38c));head.position.y=1.15;player.add(head);player.position.set(0,1,35);
const foes=[];for(let i=0;i<18;i++){let x=(rnd()-.5)*18,z=10-rnd()*140;const o=mesh(new T.IcosahedronGeometry(1,0),enemyMat,x,.75,z,.75,.75,.75);foes.push({o,hp:3,alive:true})}
const blastMat=new T.ShaderMaterial({transparent:true,depthWrite:false,side:T.DoubleSide,uniforms:{time:{value:0}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec2 vUv;uniform float time;void main(){float d=length(vUv-.5)*2.;float ring=1.-smoothstep(.07,.17,abs(d-time));gl_FragColor=vec4(.25,.76,1.,ring*.65);}'});
const fx=new T.Mesh(new T.PlaneGeometry(13,13),blastMat);fx.rotation.x=-Math.PI/2;fx.visible=false;scene.add(fx);
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')cast()});addEventListener('keyup',e=>keys[e.code]=false);
let stickX=0,stickY=0;const stick=document.getElementById('stick'),nub=document.getElementById('nub');function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.max(1,Math.hypot(dx,dy)),k=Math.min(1,len/43);stickX=dx/len*k;stickY=dy/len*k;nub.style.transform='translate('+stickX*38+'px,'+stickY*38+'px)'}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.buttons)moveStick(e)});function stop(){stickX=stickY=0;nub.style.transform=''}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);
let jump=0,velocity=0,spellTime=-1,kills=0;document.getElementById('spell').onclick=cast;document.getElementById('jump').onclick=()=>{if(jump<=0){velocity=7;jump=.001}};
function cast(){if(spellTime>=0)return;spellTime=0;fx.position.set(player.position.x,.08,player.position.z);fx.visible=true;for(const f of foes){if(!f.alive)continue;if(f.o.position.distanceTo(player.position)<7){f.hp--;f.o.scale.multiplyScalar(.9);if(f.hp<=0){f.alive=false;scene.remove(f.o);kills++}}}}
const clock=new T.Clock();let last=0,frames=0,elapsed=0;
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;frames++;if(elapsed>1){document.getElementById('fps').textContent=Math.round(frames/elapsed)+' FPS · '+kills+' Gegner';elapsed=frames=0}
const x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+stickX,z=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+stickY;const n=Math.max(1,Math.hypot(x,z));player.position.x=T.MathUtils.clamp(player.position.x+x/n*dt*7,-95,95);player.position.z=T.MathUtils.clamp(player.position.z+z/n*dt*7,-150,60);if(x||z)player.rotation.y=Math.atan2(-x,-z);
if(jump>0){velocity-=18*dt;jump=Math.max(0,jump+velocity*dt);if(jump===0)velocity=0}player.position.y=1+jump;
if(spellTime>=0){spellTime+=dt;blastMat.uniforms.time.value=spellTime*2.4;if(spellTime>.46){spellTime=-1;fx.visible=false}}
const desired=new T.Vector3(player.position.x,player.position.y+8,player.position.z+15);camera.position.lerp(desired,1-Math.exp(-dt*5));camera.lookAt(player.position.x,player.position.y+1,player.position.z-7);
if(player.position.z<-142)document.getElementById('quest').textContent='Du hast das Tor der Enklave erreicht! Nächster Schritt: Hauptstadt und NPC-System.';renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
addEventListener('error',e=>{const x=document.getElementById('error');x.style.display='block';x.textContent=e.message});tick();
</script></body></html>
